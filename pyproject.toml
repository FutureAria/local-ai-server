[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-server"
version = "0.1.0"
description = "Local-only FastAPI RAG server backed by Ollama, SQLite, Chroma, and Typer."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.0",
  "chromadb>=0.5.0",
  "typer>=0.12.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
documents = [
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
local-ai = "cli.main:app"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
